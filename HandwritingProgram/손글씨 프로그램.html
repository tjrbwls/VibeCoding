<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handwritten Digit Recognizer</title>
<style>
:root{--bg:#f3f1ec;--fg:#1d1d22;--muted:#6b6b73;--pad:#fff;--ink:#14141a;--bar:#d6d3ca;--hit:#2457d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c;--fg:#ecebe6;--muted:#9a9aa3;--pad:#0e0e12;--ink:#f4f4f0;--bar:#34343c;--hit:#7da2ff}}
:root[data-theme="dark"]{--bg:#17171c;--fg:#ecebe6;--muted:#9a9aa3;--pad:#0e0e12;--ink:#f4f4f0;--bar:#34343c;--hit:#7da2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Source Serif 4",Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 20px 40px}
h1{font:600 28px/1.2 "Source Serif 4",Georgia,serif;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted)}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
canvas#pad{width:min(100%,280px);aspect-ratio:1;background:var(--pad);border:2px solid var(--fg);border-radius:4px;touch-action:none;cursor:crosshair}
.side{flex:1;min-width:240px}
.big{font:700 96px/1 "Source Serif 4",Georgia,serif;min-height:96px}
.conf{color:var(--muted);margin-bottom:12px}
.bars{display:grid;grid-template-columns:18px 1fr 44px;gap:4px 8px;align-items:center;font-size:14px}
.track{height:10px;background:var(--bar);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--muted)}
.fill.top{background:var(--hit)}
button{margin-top:14px;padding:8px 18px;font:inherit;color:var(--fg);background:transparent;border:2px solid var(--fg);border-radius:4px;cursor:pointer}
button:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
canvas#prev{width:64px;height:64px;image-rendering:pixelated;border:1px solid var(--bar);vertical-align:middle;margin-left:8px}
</style></head><body><main>
<h1>Handwritten digit recognizer</h1>
<p class="sub">Draw one digit from 0 to 9 with your mouse or finger.</p>

    <div class="big" id="out">?</div>
    <div class="conf"><span id="conf">Waiting for a drawing</span><canvas id="prev" width="8" height="8"></canvas></div>
    <div class="bars" id="bars"></div>
  </div>
</div>
</main>

const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
const out = document.getElementById("out"), conf = document.getElementById("conf");
const prev = document.getElementById("prev").getContext("2d");
const barsEl = document.getElementById("bars");
const S = pad.width;

// Build the 10 probability rows once
const fills = [], pcts = [];
for (let d = 0; d < 10; d++) {
  barsEl.insertAdjacentHTML("beforeend", `<span>${d}</span><div class="track"><div class="fill"></div></div><span class="pct">0%</span>`);
}
barsEl.querySelectorAll(".fill").forEach(e => fills.push(e));
barsEl.querySelectorAll(".pct").forEach(e => pcts.push(e));

function ink() { return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#000"; }
function reset() {
  ctx.clearRect(0, 0, S, S);
  out.textContent = "?"; conf.textContent = "Waiting for a drawing";
  fills.forEach((f, i) => { f.style.width = "0"; f.classList.remove("top"); pcts[i].textContent = "0%"; });
  prev.clearRect(0, 0, 8, 8);
}

// Drawing with pointer events (works for mouse, touch and pen)
let drawing = false, last = null;
function pos(e) { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * S / r.width, (e.clientY - r.top) * S / r.height]; }
pad.addEventListener("pointerdown", e => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); stroke(last, last); });
pad.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); stroke(last, p); last = p; });
const end = () => { if (drawing) { drawing = false; recognize(); } };
pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);
function stroke(a, b) {
  ctx.strokeStyle = ink(); ctx.lineWidth = 22; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
document.getElementById("clear").onclick = reset;

// Convert the drawing into an 8x8 grid: crop to the bounding box, make it square, average-pool
function preprocess() {
  const px = ctx.getImageData(0, 0, S, S).data;
  let x0 = S, y0 = S, x1 = -1, y1 = -1;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (px[(y * S + x) * 4 + 3] > 40) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  }
  if (x1 < 0) return null;
  const side = Math.max(x1 - x0 + 1, y1 - y0 + 1) * 1.25;   // leave a margin like the training data
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, sx = cx - side / 2, sy = cy - side / 2;
  const grid = new Array(64).fill(0), cell = side / 8;
  for (let gy = 0; gy < 8; gy++) for (let gx = 0; gx < 8; gx++) {
    let sum = 0, n = 0;
    for (let y = Math.floor(sy + gy * cell); y < sy + (gy + 1) * cell; y++) {
      for (let x = Math.floor(sx + gx * cell); x < sx + (gx + 1) * cell; x++) {
        n++;
        if (x >= 0 && y >= 0 && x < S && y < S) sum += px[(y * S + x) * 4 + 3] / 255;
      }
    }
    grid[gy * 8 + gx] = n ? sum / n : 0;
  }
  const mx = Math.max(...grid);
  return grid.map(v => v / mx);                              // normalize to [0, 1]
}

// Forward pass: ReLU hidden layer, softmax output
function predict(x) {
  const h = M.b1.map((b, j) => { let s = b; for (let i = 0; i < 64; i++) s += x[i] * M.W1[i][j]; return Math.max(0, s); });
  const z = M.b2.map((b, k) => { let s = b; for (let j = 0; j < h.length; j++) s += h[j] * M.W2[j][k]; return s; });
  const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), t = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / t);
}

function recognize() {
  const x = preprocess(); if (!x) return;
  const img = prev.createImageData(8, 8);
  x.forEach((v, i) => { const c = 255 - Math.round(v * 255); img.data.set([c, c, c, 255], i * 4); });
  prev.putImageData(img, 0, 0);
  const p = predict(x), best = p.indexOf(Math.max(...p));
  out.textContent = best;
  conf.textContent = "Confidence " + Math.round(p[best] * 100) + "%";
  p.forEach((v, i) => { fills[i].style.width = (v * 100) + "%"; fills[i].classList.toggle("top", i === best); pcts[i].textContent = Math.round(v * 100) + "%"; });
}
