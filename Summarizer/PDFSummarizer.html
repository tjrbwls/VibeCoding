<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 요약기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--text:#1d2230;--sub:#5d6578;--line:#dfe3ee;--pri:#3b5bdb;--pri-t:#fff;--pri-bg:#edf1ff;--err:#c92a2a;--err-bg:#fff0f0;--ok:#2b8a3e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141720;--card:#1d212c;--text:#eef0f6;--sub:#a3abbe;--line:#313748;--pri:#7c97ff;--pri-t:#10131c;--pri-bg:#232a45;--err:#ff8787;--err-bg:#3a2024;--ok:#69db7c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141720;--card:#1d212c;--text:#eef0f6;--sub:#a3abbe;--line:#313748;--pri:#7c97ff;--pri-t:#10131c;--pri-bg:#232a45;--err:#ff8787;--err-bg:#3a2024;--ok:#69db7c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.7rem;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.opts{display:flex;flex-wrap:wrap;gap:18px}
.opts fieldset{border:0;margin:0;padding:0}
.opts legend{font-size:.85rem;color:var(--sub);margin-bottom:6px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 14px;font-size:.92rem}
.seg input:checked+span{background:var(--pri);color:var(--pri-t);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--pri);outline-offset:-2px}
#drop{border:2px dashed var(--line);border-radius:16px;padding:44px 16px;text-align:center;cursor:pointer;background:var(--card);transition:.15s}
#drop:hover,#drop:focus-visible,#drop.over{border-color:var(--pri);background:var(--pri-bg);outline:none}
#drop .ic{font-size:2.4rem}
#drop b{display:block;font-size:1.05rem;margin:6px 0 2px}
#drop small{color:var(--sub)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px}
button.pri{background:var(--pri);color:var(--pri-t);border-color:var(--pri);font-weight:700}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.msg{margin-top:10px;padding:11px 14px;border-radius:10px;background:var(--err-bg);color:var(--err);font-size:.95rem}
.file{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file .nm{font-weight:700;word-break:break-all}
.file .meta{color:var(--sub);font-size:.88rem}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:16px 0 8px;flex-wrap:wrap}
.steps li{flex:1 1 120px;padding:8px 10px;border-radius:10px;background:var(--bg);color:var(--sub);font-size:.88rem;text-align:center;border:1px solid var(--line)}
.steps li.on{background:var(--pri-bg);color:var(--pri);border-color:var(--pri);font-weight:700}
.steps li.done{color:var(--ok);border-color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.stat{color:var(--sub);font-size:.9rem;margin-top:8px}
.one{font-size:1.15rem;font-weight:700;line-height:1.55}
h2{font-size:.82rem;letter-spacing:.04em;color:var(--sub);margin:0 0 10px;font-weight:700}
.res ul{margin:0;padding-left:1.2em}.res li{margin-bottom:8px}.res p{margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:var(--pri-bg);color:var(--pri);border-radius:99px;padding:3px 12px;font-size:.88rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
footer{color:var(--sub);font-size:.82rem;text-align:center;margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>PDF 요약기</h1>
<p class="lead">PDF를 올리면 AI가 핵심만 요약해 드려요.</p>

<section class="card" aria-label="요약 옵션">
<div class="opts">
<fieldset><legend>요약 길이</legend><div class="seg">
<label><input type="radio" name="len" value="short"><span>짧게</span></label>
<label><input type="radio" name="len" value="mid" checked><span>보통</span></label>
<label><input type="radio" name="len" value="long"><span>자세히</span></label></div></fieldset>
<fieldset><legend>요약 형식</legend><div class="seg">
<label><input type="radio" name="fmt" value="list" checked><span>핵심 요점 목록</span></label>
<label><input type="radio" name="fmt" value="prose"><span>서술형 문단</span></label></div></fieldset>
</div>
</section>

<div id="v-idle">
<div id="drop" role="button" tabindex="0" aria-label="PDF 파일 선택">
<div class="ic" aria-hidden="true">📄</div>
<b>PDF 파일을 여기에 끌어다 놓거나 클릭하여 선택하세요</b>
<small>PDF 형식, 최대 20MB, 한 번에 1개</small>
</div>
<input id="inp" type="file" accept="application/pdf,.pdf" hidden>
<div id="err" class="msg" role="alert" hidden></div>
</div>

<section id="v-work" class="card" hidden>
<div class="file"><span aria-hidden="true">📄</span><div><div class="nm" id="w-nm"></div><div class="meta" id="w-meta"></div></div></div>
<ol class="steps" id="steps"><li>업로드</li><li>텍스트 추출</li><li>요약 생성</li><li>완료</li></ol>
<div class="bar"><i id="pg"></i></div>
<div class="stat" id="stat" aria-live="polite"></div>
<div class="acts" style="margin-top:12px"><button id="cancel">취소</button></div>
</section>

<div id="v-done" hidden>
<section class="card"><div class="file"><span aria-hidden="true">✅</span><div><div class="nm" id="d-nm"></div><div class="meta" id="d-meta"></div></div></div></section>
<section class="card res"><h2>한 줄 요약</h2><div class="one" id="r-one"></div></section>
<section class="card res"><h2>핵심 요점</h2><div id="r-pts"></div></section>
<section class="card res"><h2>주요 키워드</h2><div class="tags" id="r-kw"></div></section>
<div class="acts">
<button class="pri" id="b-copy">복사</button>
<button id="b-dl">텍스트(.txt) 다운로드</button>
<button id="b-re">다시 요약</button>
<button id="b-new">새 파일 올리기</button>
</div>
<div id="note" class="stat" aria-live="polite"></div>
</div>

<footer>업로드한 파일은 브라우저에서만 처리되며 서버에 저장되지 않아요. 요약 내용은 AI 특성상 부정확할 수 있으니 중요한 내용은 원문과 확인하세요.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var MAX=20*1024*1024,CHUNK=14000,CAP=300000;
var ERR={INVALID_FILE_TYPE:'PDF 파일만 업로드할 수 있어요.',MULTI:'파일은 한 번에 1개만 올릴 수 있어요.',FILE_TOO_LARGE:'파일이 너무 커요. 20MB 이하의 파일을 올려주세요.',PDF_ENCRYPTED:'암호로 보호된 문서는 요약할 수 없어요. 암호를 해제한 뒤 다시 올려주세요.',PDF_CORRUPTED:'파일이 손상되었거나 읽을 수 없어요. 다른 파일로 시도해 주세요.',NO_TEXT_FOUND:'문서에서 텍스트를 찾지 못했어요. 이미지로 만들어진 PDF일 수 있어요.',SUMMARY_FAILED:'요약 중 문제가 발생했어요. 잠시 후 다시 시도해 주세요.',RATE_LIMITED:'요청이 많아 잠시 대기 중이에요. 잠시 후 다시 시도해 주세요.',NOT_GRANTED:'AI 요약 사용 권한이 필요해요. 허용 후 다시 시도해 주세요.',NO_AI:'이 화면에서는 AI 요약 기능을 사용할 수 없어요.',LIB_FAILED:'PDF 처리 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.',TOO_SHORT:'요약할 내용이 부족해요. 텍스트가 더 많은 문서를 올려주세요.'};
function AE(c){var e=new Error(ERR[c]||ERR.SUMMARY_FAILED);e.app=c;return e}
var st={file:null,text:'',pages:0,result:null,ctl:null,run:0};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var show=function(id){['v-idle','v-work','v-done'].forEach(function(v){$('#'+v).hidden=(v!==id)})};
function opt(n){return document.querySelector('input[name='+n+']:checked').value}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+'MB':Math.max(1,Math.round(b/1024))+'KB'}
function setStep(i,pct,txt){
 var li=$('#steps').children;
 for(var k=0;k<li.length;k++)li[k].className=k<i?'done':(k===i?'on':'');
 if(pct!=null)$('#pg').style.width=pct+'%';
 if(txt!=null)$('#stat').textContent=txt;
}
function showErr(m){var e=$('#err');e.textContent=m;e.hidden=false}
function reset(){st.run++;if(st.ctl)st.ctl.abort();st.file=null;st.text='';st.result=null;$('#inp').value='';$('#err').hidden=true;show('v-idle')}

async function validate(files){
 if(!files||!files.length)throw AE('INVALID_FILE_TYPE');
 if(files.length>1)throw AE('MULTI');
 var f=files[0];
 if(!/\.pdf$/i.test(f.name)||(f.type&&f.type!=='application/pdf'))throw AE('INVALID_FILE_TYPE');
 if(f.size===0)throw AE('PDF_CORRUPTED');
 if(f.size>MAX)throw AE('FILE_TOO_LARGE');
 var head=new Uint8Array(await f.slice(0,1024).arrayBuffer());
 var s='';for(var i=0;i<head.length;i++)s+=String.fromCharCode(head[i]);
 if(s.indexOf('%PDF-')<0)throw AE('INVALID_FILE_TYPE');
 return f;
}

async function extract(file,run){
 if(!window.pdfjsLib)throw AE('LIB_FAILED');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 var buf=await file.arrayBuffer(),pdf;
 try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise}
 catch(e){throw AE(e&&e.name==='PasswordException'?'PDF_ENCRYPTED':'PDF_CORRUPTED')}
 var pages=[];
 for(var p=1;p<=pdf.numPages;p++){
  if(run!==st.run)throw new Error('cancel');
  var tc;
  try{tc=await(await pdf.getPage(p)).getTextContent()}catch(e){pages.push([]);continue}
  var lines=[],cur='',lastY=null;
  tc.items.forEach(function(it){
   if(typeof it.str!=='string')return;
   var y=it.transform?it.transform[5]:0;
   if(lastY!==null&&Math.abs(y-lastY)>3&&cur){lines.push(cur);cur=''}
   cur+=it.str;lastY=y;
   if(it.hasEOL){lines.push(cur);cur=''}
  });
  if(cur)lines.push(cur);
  pages.push(lines.map(function(l){return l.replace(/\s+/g,' ').trim()}).filter(Boolean));
  setStep(1,5+Math.round(p/pdf.numPages*40),'텍스트 추출 중… ('+p+'/'+pdf.numPages+'쪽)');
 }
 return{pages:pages,n:pdf.numPages};
}

function clean(pages){
 var cnt={};
 pages.forEach(function(ls){var seen={};ls.forEach(function(l){if(l.length<80&&!seen[l]){seen[l]=1;cnt[l]=(cnt[l]||0)+1}})});
 var rep=pages.length>=4?Math.ceil(pages.length*.5):1e9;
 var out=[];
 pages.forEach(function(ls){
  var buf='';
  ls.forEach(function(l){
   if(cnt[l]>=rep||/^[-–\s]*\d{1,4}[-–\s]*$/.test(l)||/^(page\s*)?\d+\s*(\/|of)\s*\d+$/i.test(l))return;
   if(buf&&!/[.!?。…:)”"'다요죠음함]$/.test(buf)){buf+=' '+l}else{if(buf)buf+='\n';buf+=l}
  });
  if(buf)out.push(buf);
 });
 return out.join('\n\n').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}

function chunk(t){
 var out=[],i=0;
 while(i<t.length){
  var end=Math.min(i+CHUNK,t.length);
  if(end<t.length){var b=t.lastIndexOf('\n',end);if(b>i+CHUNK*.5)end=b+1}
  out.push(t.slice(i,end));i=end;
 }
 return out;
}

async function ask(fn,run){
 for(var i=0;;i++){
  try{return await fn()}
  catch(e){
   if(run!==st.run)throw new Error('cancel');
   if(e&&e.code==='not_granted')throw AE('NOT_GRANTED');
   if(i>=2)throw AE(e&&e.code==='rate_limited'?'RATE_LIMITED':'SUMMARY_FAILED');
   await sleep(1000*Math.pow(2,i));
  }
 }
}

async function summarize(run){
 var sample=await claude.use('sample');
 if(!sample)throw AE('NO_AI');
 var ctl=st.ctl=new AbortController(),len=opt('len'),fmt=opt('fmt');
 var text=st.text,parts=chunk(text),partial=[];
 if(parts.length>1){
  for(var i=0;i<parts.length;i++){
   if(run!==st.run)throw new Error('cancel');
   setStep(2,50+Math.round(i/parts.length*40),'긴 문서를 나누어 요약 중… ('+(i+1)+'/'+parts.length+')');
   var r=await ask(function(){return sample('다음은 긴 문서의 일부(구간 '+(i+1)+'/'+parts.length+')입니다. 원문에 있는 내용만 근거로, 핵심 사실과 주장을 한국어로 5~8문장으로 요약하세요. 요약문만 출력하세요.\n\n'+parts[i],{signal:ctl.signal,cache:false})},run);
   partial.push(r.text);
  }
 }
 setStep(2,92,'최종 요약을 정리하는 중…');
 var src=parts.length>1?'다음은 한 문서를 구간별로 요약한 내용입니다. 이를 종합해 문서 전체를 요약하세요.\n\n'+partial.map(function(p,k){return '[구간 '+(k+1)+'] '+p}).join('\n\n'):'다음 문서를 요약하세요.\n\n'+text;
 var n={short:{list:'정확히 3개',prose:'1개'},mid:{list:'5~8개',prose:'2~3개'},long:{list:'8~12개',prose:'4~6개'}}[len][fmt];
 var how=fmt==='list'?'points는 한 줄짜리 핵심 요점 '+n+'로 작성':'points는 자연스럽게 이어지는 서술형 문단 '+n+'로 작성';
 var prompt='원문에 근거한 내용만 한국어로 요약하고, 원문에 없는 사실을 지어내지 마세요. 입력이 어떤 언어이든 한국어로 쓰세요. '+how+'하세요. 반드시 JSON만 출력하세요. 형식: {"oneLine":"한 줄 요약","points":["..."],"keywords":["키워드 5~8개"]}\n\n'+src;
 var j=await ask(function(){return sample.json(prompt,{signal:ctl.signal,cache:false})},run);
 if(!j||typeof j.oneLine!=='string'||!Array.isArray(j.points))throw AE('SUMMARY_FAILED');
 return{one:j.oneLine,points:j.points.map(String),kw:(Array.isArray(j.keywords)?j.keywords:[]).map(String)};
}

function render(r){
 $('#r-one').textContent=r.one;
 var box=$('#r-pts');box.textContent='';
 var fmt=opt('fmt'),ul=document.createElement('ul');
 r.points.forEach(function(p){
  var e=document.createElement(fmt==='list'?'li':'p');e.textContent=p;
  (fmt==='list'?ul:box).appendChild(e);
 });
 if(fmt==='list')box.appendChild(ul);
 var kw=$('#r-kw');kw.textContent='';
 r.kw.forEach(function(k){var s=document.createElement('span');s.textContent=k;kw.appendChild(s)});
 $('#d-nm').textContent=st.file.name;
 $('#d-meta').textContent=st.pages+'쪽 · '+st.text.length.toLocaleString('ko-KR')+'자 · '+fmtSize(st.file.size);
 $('#note').textContent='';
 show('v-done');
}

async function resum(){
 var run=++st.run;
 show('v-work');setStep(2,50,'요약 준비 중…');
 try{st.result=await summarize(run);if(run!==st.run)return;setStep(3,100,'완료');render(st.result)}
 catch(e){fail(e,run)}
}
function fail(e,run){
 if(run!==st.run||(e&&e.message==='cancel'))return;
 var m=e&&e.app?e.message:ERR.SUMMARY_FAILED;
 show('v-idle');showErr(m);
}

async function handle(files){
 $('#err').hidden=true;
 var f;
 try{f=await validate(files)}catch(e){showErr(e.app?e.message:ERR.INVALID_FILE_TYPE);return}
 var run=++st.run;st.file=f;
 $('#w-nm').textContent=f.name;$('#w-meta').textContent=fmtSize(f.size);
 show('v-work');setStep(0,3,'파일을 확인했어요.');
 try{
  var ex=await extract(f,run);
  var text=clean(ex.pages);
  if(text.replace(/\s/g,'').length<1)throw AE('NO_TEXT_FOUND');
  if(text.replace(/\s/g,'').length<20)throw AE('TOO_SHORT');
  var cut=text.length>CAP;
  if(cut)text=text.slice(0,CAP);
  st.text=text;st.pages=ex.n;
  $('#w-meta').textContent=fmtSize(f.size)+' · '+ex.n+'쪽 · '+text.length.toLocaleString('ko-KR')+'자'+(cut?' (앞부분만 요약)':'');
  setStep(2,50,'요약을 시작합니다…');
  st.result=await summarize(run);
  if(run!==st.run)return;
  setStep(3,100,'완료');render(st.result);
  if(cut)$('#note').textContent='문서가 매우 길어 앞부분 '+CAP.toLocaleString('ko-KR')+'자까지만 요약했어요.';
 }catch(e){fail(e,run)}
}

function plain(){
 var r=st.result;
 return '[한 줄 요약]\n'+r.one+'\n\n[핵심 요점]\n'+r.points.map(function(p,i){return(opt('fmt')==='list'?'- ':'')+p}).join('\n')+'\n\n[주요 키워드]\n'+r.kw.join(', ')+'\n\n(원본 파일: '+st.file.name+')\n';
}
async function copy(){
 var t=plain(),ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}catch(e){
  try{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}catch(e2){}
 }
 $('#note').textContent=ok?'요약을 복사했어요.':'복사하지 못했어요. 결과를 직접 선택해 복사해 주세요.';
}
async function dl(){
 var d=null;try{d=await claude.use('downloads')}catch(e){}
 if(!d){$('#note').textContent='이 화면에서는 다운로드를 지원하지 않아요. 복사 버튼을 이용해 주세요.';return}
 try{await d.save({filename:st.file.name.replace(/\.pdf$/i,'')+'_요약.txt',data:plain()});$('#note').textContent=''}
 catch(e){$('#note').textContent=e&&e.code==='declined'?'':'다운로드하지 못했어요. 복사 버튼을 이용해 주세요.'}
}

var drop=$('#drop'),inp=$('#inp');
drop.addEventListener('click',function(){inp.click()});
drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}});
inp.addEventListener('change',function(){handle(inp.files);inp.value=''});
['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){handle(e.dataTransfer&&e.dataTransfer.files)});
window.addEventListener('dragover',function(e){e.preventDefault()});
window.addEventListener('drop',function(e){e.preventDefault()});
$('#cancel').addEventListener('click',reset);
$('#b-new').addEventListener('click',reset);
