<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
:root{
  --bg:#eaf1ed; --paper:#ffffff; --ink:#1b3830; --muted:#6a8279;
  --line:#d3dfd9; --accent:#f2c230; --on-accent:#1b3830; --danger:#a8402f;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1815; --paper:#172620; --ink:#e3efe8; --muted:#8ba499; --line:#2a3e35; --danger:#e8806c}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  min-height:100vh; padding:32px 16px 64px;
}
main{max-width:520px; margin:0 auto}
h1{font-size:2rem; line-height:1.2; margin:0 0 4px; font-weight:800; letter-spacing:-.02em}
#count{margin:0 0 20px; color:var(--muted); min-height:1.5em}

form{display:flex; gap:8px; margin-bottom:16px}
input[type=text]{
  flex:1; min-width:0; height:52px; padding:0 16px; font:inherit;
  color:var(--ink); background:var(--paper);
  border:2px solid var(--line); border-radius:12px;
}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus{outline:none; border-color:var(--ink)}
button{font:inherit; cursor:pointer}
.add{
  height:52px; padding:0 20px; border:0; border-radius:12px;
  background:var(--ink); color:var(--bg); font-weight:700;
}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

#warn{
  display:none; margin:0 0 12px; padding:10px 14px; border-radius:10px;
  background:var(--paper); border:2px solid var(--danger); color:var(--danger); font-size:.9rem;
}

ul{list-style:none; margin:0; padding:0; background:var(--paper); border-radius:16px; border:1px solid var(--line); overflow:hidden}
li{display:flex; align-items:center; border-bottom:1px solid var(--line); min-height:56px}
li:last-child{border-bottom:0}
label.row{flex:1; min-width:0; display:flex; align-items:center; gap:14px; padding:8px 4px 8px 16px; min-height:56px; cursor:pointer}
input[type=checkbox]{
  appearance:none; -webkit-appearance:none; flex:none; margin:0;
  width:28px; height:28px; border:2px solid var(--ink); border-radius:8px; background:transparent;
  display:grid; place-content:center; cursor:pointer;
  transition:background-color .15s, border-color .15s;
}
input[type=checkbox]::after{
  content:""; width:12px; height:7px; margin-top:-3px;
  border-left:3px solid var(--on-accent); border-bottom:3px solid var(--on-accent);
  transform:rotate(-45deg) scale(0); transition:transform .15s;
}
input[type=checkbox]:checked{background:var(--accent); border-color:var(--accent)}
input[type=checkbox]:checked::after{transform:rotate(-45deg) scale(1)}
.t{
  overflow-wrap:anywhere; font-size:1.05rem;
  background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 2px;
  transition:background-size .25s ease, color .2s;
}
li.done .t{background-size:100% 2px; color:var(--muted)}
.del{
  flex:none; min-width:56px; height:56px; border:0; background:transparent;
  color:var(--muted); font-size:.9rem;
}
.del:hover{color:var(--danger)}

.empty{padding:40px 20px; text-align:center; color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-size:1.1rem; margin-bottom:4px}

#foot{display:flex; justify-content:flex-end; margin-top:12px; min-height:40px}
.clear{border:0; background:transparent; color:var(--muted); text-decoration:underline; text-underline-offset:3px; padding:8px 4px}
.clear:hover{color:var(--ink)}

#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none;
  display:flex; align-items:center; gap:12px; padding:10px 10px 10px 18px; border-radius:12px;
  background:var(--ink); color:var(--bg); transition:opacity .2s, transform .2s; max-width:calc(100% - 32px);
}
#toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto}
#toast button{border:0; border-radius:8px; padding:8px 12px; background:var(--accent); color:var(--on-accent); font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:360px){h1{font-size:1.7rem} .add{padding:0 14px}}
</style>
</head>
<body>
<main>
  <h1>쇼핑 리스트</h1>
  <p id="count" aria-live="polite"></p>

  <form id="form" autocomplete="off">
    <input type="text" id="input" maxlength="100" placeholder="사 올 물건을 적어 보세요" aria-label="물건 이름">
    <button class="add" type="submit">추가</button>
  </form>

  <p id="warn" role="alert">이 브라우저에서는 저장할 수 없어요. 창을 닫으면 목록이 사라질 수 있어요.</p>

  <ul id="list"></ul>
  <div id="empty" class="empty" hidden>
    <strong>아직 추가된 물건이 없어요</strong>
    위 입력창에 사 올 물건을 적고 Enter를 눌러 보세요.
  </div>

  <div id="foot"><button class="clear" id="clear" type="button" hidden>산 물건 지우기</button></div>
</main>

<div id="toast" role="status"><span>물건을 삭제했어요</span><button type="button" id="undo">실행 취소</button></div>

<script>
(function(){
  var KEY = 'shopping-list:v1';
  var items = [];
  var lastDeleted = null, toastTimer = null;

  var $list = document.getElementById('list');
  var $input = document.getElementById('input');
  var $count = document.getElementById('count');
  var $empty = document.getElementById('empty');
  var $clear = document.getElementById('clear');
  var $warn = document.getElementById('warn');
  var $toast = document.getElementById('toast');

  /* ---------- 저장 / 복원 ---------- */
  function load(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); }
    catch(e){ $warn.style.display = 'block'; return []; }
    if (!raw) return [];
    try {
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) return [];
      return data.filter(function(i){ return i && typeof i.text === 'string' && i.text.trim(); })
        .map(function(i){
          return { id: String(i.id || newId()), text: i.text.slice(0,100), checked: !!i.checked, createdAt: Number(i.createdAt) || Date.now() };
        });
    } catch(e){ return []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch(e){ $warn.style.display = 'block'; }
  }
  function newId(){ return Date.now() + '-' + Math.random().toString(36).slice(2,7); }

  /* ---------- 화면 ---------- */
  function makeLi(item){
    var li = document.createElement('li');
    li.dataset.id = item.id;
    if (item.checked) li.className = 'done';

    var label = document.createElement('label'); label.className = 'row';
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = item.checked;
    var t = document.createElement('span'); t.className = 't'; t.textContent = item.text;
    label.appendChild(cb); label.appendChild(t);

    var del = document.createElement('button'); del.type = 'button'; del.className = 'del';
    del.textContent = '삭제'; del.setAttribute('aria-label', item.text + ' 삭제');

    li.appendChild(label); li.appendChild(del);
    return li;
  }
  function refresh(){
    var total = items.length;
    var left = items.filter(function(i){ return !i.checked; }).length;
    var any = total > left;
    $empty.hidden = total > 0;
    $list.hidden = total === 0;
    $clear.hidden = !any;
    $count.textContent = total === 0 ? '' : (left === 0 ? '모두 샀어요 (전체 ' + total + '개)' : '남은 물건 ' + left + '개 / 전체 ' + total + '개');
  }
  function renderAll(){
    $list.textContent = '';
    items.forEach(function(i){ $list.appendChild(makeLi(i)); });
    refresh();
  }

  /* ---------- 동작 ---------- */
  function addItem(text){
    text = text.trim();
    if (!text) return false;
    var item = { id: newId(), text: text.slice(0,100), checked: false, createdAt: Date.now() };
    items.push(item);
    $list.appendChild(makeLi(item));
    save(); refresh();
    return true;
  }
  function findIndex(id){
    for (var n = 0; n < items.length; n++) if (items[n].id === id) return n;
    return -1;
  }
  function showToast(){
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast(){ $toast.classList.remove('show'); lastDeleted = null; }

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    if (addItem($input.value)) $input.value = '';
    $input.focus();
  });

  $list.addEventListener('change', function(e){
    if (e.target.type !== 'checkbox') return;
    var li = e.target.closest('li'); var n = findIndex(li.dataset.id);
    if (n < 0) return;
    items[n].checked = e.target.checked;
    li.classList.toggle('done', e.target.checked);
    save(); refresh();
  });

  $list.addEventListener('click', function(e){
    var btn = e.target.closest('.del');
    if (!btn) return;
    var li = btn.closest('li'); var n = findIndex(li.dataset.id);
    if (n < 0) return;
    lastDeleted = { item: items[n], index: n };
    items.splice(n, 1);
    li.remove();
    save(); refresh(); showToast();
  });

  $clear.addEventListener('click', function(){
    items = items.filter(function(i){ return !i.checked; });
    save(); renderAll(); $input.focus();
  });

  document.getElementById('undo').addEventListener('click', function(){
    if (!lastDeleted) return;
    items.splice(Math.min(lastDeleted.index, items.length), 0, lastDeleted.item);
    save(); renderAll(); hideToast();
  });

  items = load();
  renderAll();
})();
</script>
</body>
</html>
